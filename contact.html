<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>The Lab | Connections</title>
    <style>
        :root {
            --bg: #000000;
            --neon: #39FF14;
            --dim-green: rgba(57, 255, 20, 0.2);
            --text-gray: #888;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية الشبكة التقنية */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(var(--dim-green) 1px, transparent 1px),
                        linear-gradient(90deg, var(--dim-green) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.1;
        }

        /* زر الرجوع للملف الرئيسي */
        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            text-decoration: none;
            color: var(--neon);
            border: 1px solid var(--neon);
            padding: 8px 15px;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 15px var(--neon);
        }

        .main-container {
            width: 95%;
            max-width: 900px;
            text-align: center;
            padding: 40px 0;
        }

        .header-logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--neon);
            text-transform: uppercase;
            letter-spacing: 10px;
            margin-bottom: 40px;
            text-shadow: 0 0 15px var(--neon);
        }

        .nodes-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .node-card {
            flex: 1;
            min-width: 300px;
            border: 1px solid var(--neon);
            background: rgba(0, 10, 0, 0.9);
            padding: 30px;
            position: relative;
            transition: 0.4s;
        }

        .node-card:hover {
            box-shadow: 0 0 25px var(--dim-green);
            transform: translateY(-5px);
        }

        .node-card::before {
            content: "OPERATOR_ID";
            position: absolute;
            top: -10px;
            right: 20px;
            background: var(--neon);
            color: #000;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .name {
            font-size: 1.8rem;
            margin: 10px 0;
            color: var(--neon);
        }

        .role {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 25px;
            border-bottom: 1px solid var(--dim-green);
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .links-list {
            list-style: none;
            padding: 0;
        }

        .links-list li {
            margin: 12px 0;
        }

        .links-list a {
            text-decoration: none;
            color: #ccc;
            font-size: 0.9rem;
            display: block;
            padding: 12px;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.03);
            transition: 0.3s;
        }

        .links-list a:hover {
            border: 1px solid var(--neon);
            background: var(--dim-green);
            color: var(--neon);
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: var(--neon);
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            box-shadow: 0 0 8px var(--neon);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; }
        }

        @media (max-width: 600px) {
            .back-btn { top: 15px; left: 15px; }
            .header-logo { font-size: 1.8rem; margin-top: 60px; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">
        <span>&larr;</span> EXIT_TO_HOME
    </a>

    <div class="main-container">
        <div class="header-logo">CONTACT NODES</div>

        <div class="nodes-wrapper">
            <div class="node-card">
                <div class="name"><span class="status-dot"></span>WalHack</div>
                <div class="role">Reverse Engineering | Exploitation</div>
                <ul class="links-list">

                    <li><a href="https://t.me/walhack1337">TELEGRAM: @walhack1337</a></li>
                    <li><a href="#">DISCORD: walhack1337</a></li>
                </ul>
            </div>

            
    </div>

</body>
</html>
